name: Daily News Automation Pipeline

on:
  schedule:
    # 매일 아침 7시 KST (UTC 22:00) 자동 실행
    - cron: '0 22 * * *'
  workflow_dispatch: # GitHub Actions 탭에서 수동 'Run workflow' 버튼으로도 즉시 실행 가능

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 3.11 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: 뉴스 자동 수집 및 AI 가공 파이프라인 실행
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-4o-mini' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
        run: |
          python scripts/pipeline.py

      - name: 가공된 lessons.json 과 아카이브 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/lessons.json data/archive
          if git diff --staged --quiet; then
            echo "새로 변경된 기사가 없어 커밋을 생략합니다."
          else
            git commit -m "🤖 [자동화] 일일 뉴스 AI 가공 업데이트 ($(date +'%Y-%m-%d'))"
            git push origin HEAD:${{ github.ref_name }}
          fi
