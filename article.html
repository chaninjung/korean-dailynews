<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Daily Korean News</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=20260928">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=20260928">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png?v=20260928">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=20260928">
  <link rel="stylesheet" href="css/style.css?v=20260928">
</head>
<body>

  <!-- Honeypot -->
  <form class="bot-honeypot" aria-hidden="true" tabindex="-1">
    <input type="text" id="hp_trap_field" name="hp_trap" autocomplete="off" tabindex="-1">
  </form>

  <!-- HEADER -->
  <header class="header-container">
    <div class="top-brand-bar">
      <!-- Logo + Brand Name (Click to Home) -->
      <a href="index.html" class="brand-link" title="Daily Korean News">
        <img src="banner.png?v=20260928" alt="Daily Korean News" class="brand-banner">
      </a>

      <nav>
        <ul class="nav-menu-bar">
          <li class="nav-menu-item">
            <a href="index.html" class="nav-menu-link" data-i18n="navTop">Top</a>
          </li>
          <li class="nav-menu-item">
            <a href="index.html" class="nav-menu-link" data-i18n="navMaterials">Materials</a>
          </li>
        </ul>
      </nav>

      <!-- Language Switcher -->
      <div class="lang-switcher">
        <button class="lang-btn active" data-lang="kor" onclick="setLanguage('kor')">KOR</button>
        <button class="lang-btn" data-lang="eng" onclick="setLanguage('eng')">ENG</button>
        <button class="lang-btn" data-lang="hu" onclick="setLanguage('hu')">HU</button>
      </div>
    </div>
  </header>

  <!-- ARTICLE CONTENT -->
  <main class="article-detail-wrapper">
    <button class="back-btn" onclick="history.back()">← <span data-i18n="backBtn">Back</span></button>

    <!-- Hero Image -->
    <div class="article-detail-hero" id="article-hero">
      <img id="article-hero-img" src="" alt="">
      <div class="article-detail-hero-overlay">
        <div class="article-detail-meta" id="article-meta">
          <!-- badges injected by JS -->
        </div>
        <h1 class="article-detail-title" id="article-title">Loading...</h1>
      </div>
    </div>

    <!-- Article Body -->
    <div class="article-detail-body" id="article-body">
      <p id="article-text"></p>
    </div>

    <!-- Vocabulary Box -->
    <div class="vocab-box" id="vocab-section">
      <h4>📖 Key Vocabulary</h4>
      <ul id="vocab-list"></ul>
    </div>

    <p class="article-source" id="article-source" hidden></p>
  </main>

  <footer>
    <span data-i18n="footerText">© 2026 Daily Korean News. All rights reserved.</span>
  </footer>

  <!-- Scripts -->
  <script src="js/protection.js?v=20260928"></script>
  <script src="js/i18n.js?v=20260928"></script>
  <script>
    // Add "backBtn" translation
    if (window.translations) {
      ['kor', 'eng', 'hu'].forEach(l => {
        if (!window.translations[l]) return;
      });
    }

    // Read article ID from URL query param: article.html?id=news-1
    const params = new URLSearchParams(window.location.search);
    const articleId = params.get('id');

    async function loadArticle() {
      if (!articleId) {
        document.getElementById('article-title').textContent = 'Article not found.';
        return;
      }

      try {
        const allArticles = await window.DailyKoreanShield.loadLessonData();
        const article = allArticles.find(a => a.id === articleId);

        if (!article) {
          document.getElementById('article-title').textContent = 'Article not found.';
          return;
        }

        const lang = window.currentLang || 'kor';

        // Update page title
        document.title = (article.title[lang] || article.title['eng']) + ' — Daily Korean News';

        // Hero image
        const heroImg = document.getElementById('article-hero-img');
        heroImg.onerror = function () {
          this.onerror = null;
          this.src = 'https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=800&q=80';
        };
        heroImg.src = article.image;
        heroImg.alt = article.title[lang] || article.title['eng'];

        // Meta badges
        const metaEl = document.getElementById('article-meta');
        metaEl.innerHTML = `
          ${article.isNew ? '<span class="badge-new">NEW</span>' : ''}
          <span class="level-badge"><span class="level-badge-num">${article.levelNum}</span> ${article.level}</span>
          <span class="category-tag">${article.category}</span>
          ${article.date ? `<span class="date-tag">📅 ${article.date}</span>` : ''}
        `;

        // Title
        document.getElementById('article-title').textContent =
          article.title[lang] || article.title['eng'];

        // Body text (Render paragraphs with linebreaks)
        renderArticleBody(article.article[lang] || article.article['eng']);

        // Vocabulary (객체 배열 + 예전 문자열 형식 모두 지원)
        const vocabList = document.getElementById('vocab-list');
        vocabList.innerHTML = '';
        (article.vocab || []).forEach(v => {
          const li = document.createElement('li');
          if (typeof v === 'string') {
            li.textContent = v;
          } else if (v && v.word) {
            const parts = [v.word];
            if (v.meaning_en) parts.push(`(${v.meaning_en})`);
            if (v.meaning_hu) parts.push(`- ${v.meaning_hu}`);
            li.textContent = parts.join(' ');
          } else {
            return;
          }
          vocabList.appendChild(li);
        });

        // Discussion questions (있을 때만 표시)
        let questionsSection = document.getElementById('questions-section');
        const questions = article.questions || [];
        if (questions.length) {
          if (!questionsSection) {
            questionsSection = document.createElement('div');
            questionsSection.className = 'vocab-box';
            questionsSection.id = 'questions-section';
            const sourceEl0 = document.getElementById('article-source');
            sourceEl0.parentNode.insertBefore(questionsSection, sourceEl0);
          }
          const lang2 = (window.currentLang && ['kor','eng','hu'].includes(window.currentLang)) ? window.currentLang : 'kor';
          questionsSection.innerHTML = '<h4>💬 Discussion Questions</h4>';
          const ul = document.createElement('ul');
          questions.forEach(q => {
            const li = document.createElement('li');
            if (typeof q === 'string') li.textContent = q;
            else li.textContent = q[lang2] || q.kor || q.eng || '';
            ul.appendChild(li);
          });
          questionsSection.appendChild(ul);
        } else if (questionsSection) {
          questionsSection.remove();
        }

        const sourceEl = document.getElementById('article-source');
        const source = article.source || {};
        if (source.url) {
          const safeName = source.name || source.url;
          sourceEl.hidden = false;
          sourceEl.textContent = '출처: ';
          const sourceLink = document.createElement('a');
          sourceLink.href = source.url;
          sourceLink.target = '_blank';
          sourceLink.rel = 'noopener noreferrer';
          sourceLink.textContent = safeName;
          sourceEl.appendChild(sourceLink);
        } else {
          sourceEl.hidden = true;
          sourceEl.textContent = '';
        }

        // Re-render if language changes
        window._currentArticle = article;

      } catch (err) {
        console.error('Failed to load article:', err);
        document.getElementById('article-title').textContent = 'Failed to load article.';
      }
    }

    function renderArticleBody(text) {
      const bodyEl = document.getElementById('article-body');
      if (!bodyEl) return;
      if (!text) {
        bodyEl.innerHTML = '<p class="article-paragraph">내용이 없습니다.</p>';
        return;
      }
      // 문단 구분 (\n\n 또는 \n)
      const paragraphs = text.split(/\n\s*\n/).filter(p => p.trim().length > 0);
      if (paragraphs.length <= 1) {
        const subParas = text.split(/\n/).filter(p => p.trim().length > 0);
        if (subParas.length > 1) {
          bodyEl.innerHTML = subParas.map(p => `<p class="article-paragraph">${p.trim()}</p>`).join('');
          return;
        }
      }
      bodyEl.innerHTML = (paragraphs.length ? paragraphs : [text])
        .map(p => `<p class="article-paragraph">${p.trim()}</p>`)
        .join('');
    }

    // Hook into setLanguage to re-render article text
    const _origSetLang = window.setLanguage;
    window.setLanguage = function(lang) {
      if (_origSetLang) _origSetLang(lang);
      if (window._currentArticle) {
        const a = window._currentArticle;
        document.getElementById('article-title').textContent =
          a.title[lang] || a.title['eng'];
        renderArticleBody(a.article[lang] || a.article['eng']);
        document.title = (a.title[lang] || a.title['eng']) + ' — Daily Korean News';
      }
    };

    document.addEventListener('DOMContentLoaded', loadArticle);
  </script>

</body>
</html>
